group 'software.solid.fluttervlcplayer'
version '1.0-SNAPSHOT'

// Sources are Java only, so no Kotlin plugin: works with AGP 9 built-in Kotlin on or off.
apply plugin: "com.android.library"

android {
    namespace = "software.solid.fluttervlcplayer"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("org.mockito:mockito-core:5.0.0")
        implementation 'org.videolan.android:libvlc-all:4.0.0-eap21'
        implementation 'androidx.appcompat:appcompat:1.7.0'
        implementation 'androidx.legacy:legacy-support-v4:1.0.0'
        implementation 'androidx.annotation:annotation:1.9.1'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}
